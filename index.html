<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Your Assignment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow">
      <h2 class="mb-4">Upload Your Assignment</h2>
      <form id="uploadForm">
        <div class="mb-3">
          <label for="fileInput" class="form-label">Assignment File</label>
          <input type="file" class="form-control" id="fileInput" name="file" accept=".pdf,.docx" required />
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
      <div id="result" class="mt-4"></div>
    </div>
  </div>

  <script>
  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('user_id') || '';   // optional
    const courseId = params.get('course_id') || '';

    const formData = new FormData();
    formData.append('file', file);

    // Backend endpoint (your Render backend)
    const backendBase = 'https://test-1-werq.onrender.com';
    const backendUrl = `${backendBase}/evaluate?user_id=${encodeURIComponent(userId)}&course_id=${encodeURIComponent(courseId)}`;

    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<p class="text-info">Processing...</p>';

    try {
      const resp = await fetch(backendUrl, { method: 'POST', body: formData });
      if (!resp.ok) {
        const text = await resp.text();
        resultDiv.innerHTML = `<p class="text-danger">Server Error: ${resp.status} - ${resp.statusText}<br/>${text}</p>`;
        return;
      }
      const data = await resp.json();
      const evalObj = data.evaluation || {};
      const score = evalObj.score ?? 'N/A';
      const feedback = evalObj.feedback ?? (evalObj?.message ?? 'No feedback returned');
      const completion = data.completion_update || {};
      const status = completion.status || 'skipped';

      resultDiv.innerHTML = `
        <h4>Evaluation Result</h4>
        <p><strong>Score:</strong> ${score}</p>
        <p><strong>Feedback:</strong><pre style="white-space:pre-wrap;">${feedback}</pre></p>
        <hr>
        <h5>TalentLMS Update:</h5>
        <p>Status: ${status}</p>
      `;
    } catch (err) {
      console.error(err);
      resultDiv.innerHTML = `<p class="text-danger">Error processing request: ${err.message}</p>`;
    }
  });
  </script>
</body>
</html>
