
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Upload</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card p-4 shadow">
    <h2 class="mb-4">Upload Your Assignment</h2>
    <form id="uploadForm">
      <div class="mb-3">
        <label for="userId" class="form-label">User ID</label>
        <input type="text" class="form-control" id="userId" name="user_id" required>
      </div>
      <div class="mb-3">
        <label for="courseId" class="form-label">Course ID</label>
        <input type="text" class="form-control" id="courseId" name="course_id" required>
      </div>
      <div class="mb-3">
        <label for="fileInput" class="form-label">Assignment File</label>
        <input type="file" class="form-control" id="fileInput" name="file" accept=".pdf,.docx" required>
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    <div id="result" class="mt-4"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
