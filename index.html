<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Your Assignment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Simple Bootstrap styling -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-4">Upload Your Assignment</h2>

      <form id="uploadForm">
        <div class="mb-3">
          <label for="fileInput" class="form-label">Assignment File</label>
          <input
            type="file"
            class="form-control"
            id="fileInput"
            name="file"
            accept=".pdf,.docx"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>

      <div id="result" class="mt-4"></div>
    </div>
  </div>

  <script>
    const backendBase = "https://test-1-werq.onrender.com";

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById("fileInput");
      if (!fileInput.files.length) return;

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("file", file);

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = '<p class="text-info">Processing...</p>';

      try {
        const resp = await fetch(`${backendBase}/evaluate`, {
          method: "POST",
          body: formData,
        });

        if (!resp.ok) {
          const text = await resp.text();
          resultDiv.innerHTML = `
            <p class="text-danger">Server error: ${resp.status} ${resp.statusText}</p>
            <pre>${text}</pre>
          `;
          return;
        }

        const data = await resp.json();
        const evalObj = data.evaluation || {};
        const rawScore = evalObj.score;
        const scoreNum = isNaN(parseFloat(rawScore)) ? null : parseFloat(rawScore);
        const threshold = evalObj.threshold ?? 70;
        const passed =
          (typeof evalObj.pass === "boolean")
            ? evalObj.pass
            : (scoreNum !== null && scoreNum >= threshold);
        const feedback =
          evalObj.feedback ??
          evalObj.message ??
          "No feedback returned from the grading service.";

        // Show result in this frame
        resultDiv.innerHTML = `
          <h4>Evaluation Result</h4>
          <p><strong>Score:</strong> ${scoreNum !== null ? scoreNum : "N/A"} / ${threshold}</p>
          <p><strong>Status:</strong> ${
            passed
              ? '<span class="text-success">PASS</span>'
              : '<span class="text-danger">NOT PASSED</span>'
          }</p>
          <p><strong>Feedback:</strong></p>
          <pre style="white-space:pre-wrap;">${feedback}</pre>
        `;

        // 🔥 Send grade to parent (SCORM wrapper)
        try {
          window.parent.postMessage(
            {
              type: "aiGrade",
              score: scoreNum !== null ? scoreNum : 0,
              pass: passed,
              threshold: threshold,
            },
            "*"
          );
          console.log("Posted aiGrade message to parent:", {
            score: scoreNum,
            pass: passed,
            threshold: threshold,
          });
        } catch (err) {
          console.error("Failed to postMessage to parent:", err);
        }
      } catch (error) {
        console.error(error);
        resultDiv.innerHTML =
          '<p class="text-danger">Error processing request. Please try again.</p>';
      }
    });
  </script>
</body>
</html>
